    <script>
      // Motion is on unless the visitor asked for less; if the app never starts, show everything.
      (function (d) {
        var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
        d.classList.add(still ? "still" : "motion");
        setTimeout(function () { if (!window.__layla) d.classList.replace("motion", "still"); }, 5000);
      })(document.documentElement);
    </script>
