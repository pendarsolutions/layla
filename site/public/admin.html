<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Layla Traffic</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #ECEAE4; --surface: #F7F7F5; --ink: #191E47; --ink2: #4A4F73; --muted: #7A7E99; --line: #DEDBD3; --grid: #E7E4DD;
  --accent: #A5472A; --s1: #5563C4; --s2: #C8653F; --s3: #139E8C; --bad: #B3261E; --shadow: 0 1px 2px rgba(25,30,71,.06), 0 8px 24px rgba(25,30,71,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12163A; --surface: #191E47; --ink: #F7F7F5; --ink2: #C8D1F9; --muted: #8E95C4; --line: #2B3166; --grid: #232859;
  --accent: #E6AE9D; --s1: #6E7CE6; --s2: #D46A44; --s3: #16A08E; --bad: #FF8A80; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
} }
:root[data-theme="dark"] {
  --bg: #12163A; --surface: #191E47; --ink: #F7F7F5; --ink2: #C8D1F9; --muted: #8E95C4; --line: #2B3166; --grid: #232859;
  --accent: #E6AE9D; --s1: #6E7CE6; --s2: #D46A44; --s3: #16A08E; --bad: #FF8A80; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
.mark { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.2px; }
.mark svg { height: 26px; width: auto; }
.mark svg rect { fill: var(--ink); } .mark svg rect.dot { fill: var(--s1); }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer; color: var(--ink2); }
.btn:hover, .seg button:hover { color: var(--ink); }
.btn:focus-visible, .seg button:focus-visible, input:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.updated { color: var(--muted); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border-radius: 8px; padding: 14px 16px; box-shadow: var(--shadow); }
.tile .k { color: var(--ink2); font-size: 13px; font-weight: 600; }
.tile .v { font-size: 30px; font-weight: 800; line-height: 1.15; margin-top: 4px; }
.tile .s { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.card { background: var(--surface); border-radius: 8px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 16px; position: relative; }
.card h2 { font-size: 15px; margin: 0; font-weight: 700; }
.card .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend i.line { height: 3px; border-radius: 2px; vertical-align: 3px; width: 14px; }
svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
svg.chart text { fill: var(--muted); font-size: 11px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); border-radius: 6px; padding: 8px 10px; font-size: 12.5px;
  line-height: 1.45; white-space: nowrap; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; z-index: 2; }
.tip.on { opacity: 1; transform: none; }
.tip b { font-weight: 700; } .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .row { display: flex; justify-content: space-between; gap: 18px; }
details summary { cursor: pointer; color: var(--ink2); font-weight: 600; }
.tablewrap { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink2); font-weight: 600; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
/* sign-in */
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login form { background: var(--surface); border-radius: 10px; padding: 28px; width: min(360px, 100%); box-shadow: var(--shadow); }
.login h1 { font-size: 18px; margin: 14px 0 4px; }
.login p { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
.login input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.login button { width: 100%; margin-top: 12px; padding: 10px; border: 0; border-radius: 6px; background: var(--ink); color: var(--surface); font-weight: 700; cursor: pointer; }
.err { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 1.2em; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="login" id="login">
  <form id="loginForm" autocomplete="off">
    <span class="mark" id="markA"></span>
    <h1>Traffic panel</h1>
    <p>Enter the admin password (the server's <code>LAYLA_ADMIN_TOKEN</code>).</p>
    <input id="pw" type="password" placeholder="Password" aria-label="Password" required>
    <button type="submit" id="go">Sign in</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <span class="mark" id="markB"><span>Traffic</span></span>
    <div class="controls">
      <div class="seg" role="group" aria-label="Range" id="range">
        <button data-d="7">7 days</button><button data-d="30" aria-pressed="true">30 days</button><button data-d="90">90 days</button>
      </div>
      <button class="btn" id="refresh">Refresh</button>
      <button class="btn" id="out">Sign out</button>
      <span class="updated" id="updated"></span>
    </div>
  </header>

  <div class="tiles" id="tiles"></div>

  <section class="card">
    <h2>Requests per day</h2>
    <div class="sub">Every answered request, by who sent it. Days are UTC.</div>
    <div class="legend" id="legReq"></div>
    <div id="chartReq"></div>
  </section>

  <section class="card">
    <h2>People per day</h2>
    <div class="sub">Playground visitors are unique per day (no IPs are stored). Active users made a request with their own key.</div>
    <div class="legend" id="legPeople"></div>
    <div id="chartPeople"></div>
  </section>

  <section class="card">
    <details>
      <summary>Table</summary>
      <div class="tablewrap" id="table"></div>
    </details>
  </section>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const API = "api/v1/admin/stats";
  const KEY = "layla_admin_token";
  const store = { get() { try { return sessionStorage.getItem(KEY) || ""; } catch { return ""; } },
                  set(v) { try { sessionStorage.setItem(KEY, v); } catch {} },
                  del() { try { sessionStorage.removeItem(KEY); } catch {} } };
  const SERIES = [
    { key: "anonymous", name: "Playground (no key)", color: "var(--s1)" },
    { key: "user_key", name: "User API keys", color: "var(--s2)" },
    { key: "operator_key", name: "Operator keys", color: "var(--s3)" },
  ];
  const PEOPLE = [
    { key: "anonymous_visitors", name: "Playground visitors", color: "var(--s1)" },
    { key: "active_users", name: "Active users", color: "var(--s2)" },
  ];
  const fmt = (n) => Number(n).toLocaleString("en-US");
  const dayLabel = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });
  let token = store.get(), days = 30, data = null, timer = null;

  // Layla's tile mark, exactly as pendarsolutions.ir/layla draws it
  const markSvg = () => '<svg viewBox="0 0 20 18" shape-rendering="crispEdges" role="img" aria-label="Layla"><rect x="18" y="0" width="2" height="2"/><rect x="18" y="2" width="2" height="2"/><rect x="18" y="4" width="2" height="2"/><rect x="18" y="6" width="2" height="2"/><rect x="18" y="8" width="2" height="2"/><rect x="18" y="10" width="2" height="2"/><rect x="18" y="12" width="2" height="2"/><rect x="16" y="12" width="2" height="2"/><rect x="14" y="12" width="2" height="2"/><rect x="14" y="16" width="2" height="2" class="dot"/><rect x="12" y="8" width="2" height="2"/><rect x="12" y="10" width="2" height="2"/><rect x="12" y="12" width="2" height="2"/><rect x="10" y="12" width="2" height="2"/><rect x="10" y="16" width="2" height="2" class="dot"/><rect x="8" y="12" width="2" height="2"/><rect x="6" y="0" width="2" height="2"/><rect x="6" y="2" width="2" height="2"/><rect x="6" y="4" width="2" height="2"/><rect x="6" y="6" width="2" height="2"/><rect x="6" y="8" width="2" height="2"/><rect x="6" y="10" width="2" height="2"/><rect x="6" y="12" width="2" height="2"/><rect x="4" y="12" width="2" height="2"/><rect x="2" y="12" width="2" height="2"/><rect x="0" y="0" width="2" height="2"/><rect x="0" y="2" width="2" height="2"/><rect x="0" y="4" width="2" height="2"/><rect x="0" y="6" width="2" height="2"/><rect x="0" y="8" width="2" height="2"/><rect x="0" y="10" width="2" height="2"/><rect x="0" y="12" width="2" height="2"/></svg>';
  $("markA").innerHTML = markSvg() + "<span>Layla</span>";
  $("markB").insertAdjacentHTML("afterbegin", markSvg());

  // ---- auth ----
  async function fetchStats(t, d) {
    const r = await fetch(`${API}?days=${d}`, { headers: { Authorization: `Bearer ${t}` }, cache: "no-store" });
    if (r.status === 401) throw new Error("Wrong password.");
    if (r.status === 404) throw new Error("The panel is off on this server: LAYLA_ADMIN_TOKEN is not set.");
    if (!r.ok) throw new Error(`The server answered ${r.status}.`);
    return r.json();
  }
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const t = $("pw").value.trim(); if (!t) return;
    $("go").disabled = true; $("loginErr").textContent = "";
    try { data = await fetchStats(t, days); token = t; store.set(t); show(); }
    catch (err) { $("loginErr").textContent = err.message; }
    finally { $("go").disabled = false; }
  });
  $("out").addEventListener("click", () => { store.del(); token = ""; clearInterval(timer); $("app").hidden = true; $("login").hidden = false; $("pw").value = ""; });

  async function load() {
    try { data = await fetchStats(token, days); render(); }
    catch (err) { if (/Wrong password/.test(err.message)) { $("out").click(); $("loginErr").textContent = "Signed out: the password changed."; }
                  else $("updated").textContent = err.message; }
  }
  function show() {
    $("login").hidden = true; $("app").hidden = false; render();
    clearInterval(timer); timer = setInterval(load, 60000);
  }
  $("refresh").addEventListener("click", load);
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (!$("app").hidden) render(); }, 150); });
  $("range").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    days = +b.dataset.d; [...$("range").children].forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false")); load();
  });

  // ---- render ----
  function render() {
    if (!data) return;
    const D = data.days, today = D[D.length - 1];
    const sum = (k) => D.reduce((a, r) => a + r[k], 0);
    const failed = sum("failed"), req = sum("requests");
    $("tiles").innerHTML = [
      ["Accounts", fmt(data.users.total), `${fmt(data.users.with_keys)} with an API key`],
      ["Requests today", fmt(today.requests), `${fmt(today.outputs)} answers`],
      ["Visitors today", fmt(today.anonymous_visitors), `${fmt(today.active_users)} active key users`],
      [`Requests, ${days} days`, fmt(req), `avg ${fmt(Math.round(req / D.length))} a day`],
      [`New accounts, ${days} days`, fmt(sum("new_users")), `${fmt(today.new_users)} today`],
      [`Failed, ${days} days`, fmt(failed), req ? `${(100 * failed / (req || 1)).toFixed(1)}% of requests` : "no requests yet"],
    ].map(([k, v, s]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    legend($("legReq"), SERIES, false); legend($("legPeople"), PEOPLE, true);
    bars($("chartReq"), D); lines($("chartPeople"), D);
    table(D);
  }
  function legend(el, S, line) { el.innerHTML = S.map((s) => `<span><i class="${line ? "line" : ""}" style="background:${s.color}"></i>${s.name}</span>`).join(""); }

  // charts draw at the real pixel width of their card, so labels stay readable on a phone
  let W = 1000; const H = 260, M = { l: 44, r: 12, t: 10, b: 26 };
  function niceMax(v) { if (v <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
  function axes(maxV, D, step) {
    const iw = W - M.l - M.r, ih = H - M.t - M.b; let g = "";
    for (let i = 0; i <= 4; i++) { const v = maxV * i / 4, y = M.t + ih - ih * i / 4;
      g += `<line x1="${M.l}" x2="${W - M.r}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>` +
           `<text x="${M.l - 8}" y="${y + 4}" text-anchor="end">${fmt(Math.round(v))}</text>`; }
    const every = Math.ceil(D.length / Math.max(3, Math.floor((W - M.l) / 80)));
    D.forEach((r, i) => { if ((D.length - 1 - i) % every) return; g += `<text x="${M.l + step * (i + 0.5)}" y="${H - 6}" text-anchor="middle">${dayLabel(r.day)}</text>`; });
    return g;
  }
  function tipFor(host) {
    let t = host.parentElement.querySelector(".tip");
    if (!t) { t = document.createElement("div"); t.className = "tip"; host.parentElement.append(t); }
    return t;
  }
  function placeTip(t, host, xFrac, html) {
    t.innerHTML = html; t.classList.add("on");
    const box = host.getBoundingClientRect(), card = host.parentElement.getBoundingClientRect();
    let x = box.left - card.left + box.width * xFrac + 12; const w = t.offsetWidth;
    if (x + w > card.width - 8) x = box.left - card.left + box.width * xFrac - w - 12;
    t.style.left = Math.max(8, x) + "px"; t.style.top = (box.top - card.top + 8) + "px";
  }
  function bars(host, D) {
    W = Math.max(300, Math.round(host.clientWidth || 1000));
    const iw = W - M.l - M.r, ih = H - M.t - M.b, step = iw / D.length;
    const maxV = niceMax(Math.max(1, ...D.map((r) => r.requests)));
    const bw = Math.max(2, Math.min(28, step * 0.62));
    let g = axes(maxV, D, step);
    D.forEach((r, i) => {
      let y = M.t + ih; const x = M.l + step * i + (step - bw) / 2;
      const parts = SERIES.map((s) => ({ s, v: r.by_channel[s.key] || 0 })).filter((p) => p.v > 0);
      parts.forEach((p, j) => {
        const h = ih * p.v / maxV, top = j === parts.length - 1;
        const hh = Math.max(0, h - (j > 0 ? 2 : 0));            // 2px surface gap between stacked segments
        y -= h;
        const rad = top ? Math.min(4, bw / 2, hh) : 0;
        g += rad ? `<path d="M${x},${y + h - (j > 0 ? 2 : 0)} V${y + rad} Q${x},${y} ${x + rad},${y} H${x + bw - rad} Q${x + bw},${y} ${x + bw},${y + rad} V${y + h - (j > 0 ? 2 : 0)} Z" fill="${p.s.color}"/>`
                 : `<rect x="${x}" y="${y}" width="${bw}" height="${hh}" fill="${p.s.color}"/>`;
      });
    });
    const band = (i) => `<rect class="band" data-i="${i}" x="${M.l + step * i}" y="${M.t}" width="${step}" height="${ih}" fill="var(--grid)" opacity="0"/>`;
    g = D.map((_, i) => band(i)).join("") + g + D.map((_, i) => `<rect class="hit" data-i="${i}" x="${M.l + step * i}" y="${M.t}" width="${step}" height="${ih}" fill="transparent"/>`).join("");
    if (!D.some((r) => r.requests)) g += `<text x="${W / 2}" y="${M.t + ih / 2}" text-anchor="middle" style="font-size:14px">No requests in this range yet</text>`;
    host.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Requests per day by channel">${g}</svg>`;
    const svg = host.firstChild, t = tipFor(host);
    svg.addEventListener("pointermove", (e) => {
      const hit = e.target.closest(".hit"); if (!hit) return;
      const i = +hit.dataset.i, r = D[i];
      svg.querySelectorAll(".band").forEach((h) => h.setAttribute("opacity", +h.dataset.i === i ? 1 : 0));
      placeTip(t, svg, (i + 0.5) / D.length * (iw / W) + M.l / W,
        `<b>${dayLabel(r.day)}</b> · ${fmt(r.requests)} requests` + SERIES.map((s) =>
          `<div class="row"><span><i style="background:${s.color}"></i>${s.name}</span><span>${fmt(r.by_channel[s.key] || 0)}</span></div>`).join("") +
        (r.failed ? `<div class="row"><span>Failed</span><span>${fmt(r.failed)}</span></div>` : ""));
    });
    svg.addEventListener("pointerleave", () => { t.classList.remove("on"); svg.querySelectorAll(".band").forEach((h) => h.setAttribute("opacity", 0)); });
  }
  function lines(host, D) {
    W = Math.max(300, Math.round(host.clientWidth || 1000));
    const iw = W - M.l - M.r, ih = H - M.t - M.b, step = iw / D.length;
    const maxV = niceMax(Math.max(1, ...D.flatMap((r) => PEOPLE.map((p) => r[p.key]))));
    let g = axes(maxV, D, step);
    const X = (i) => M.l + step * (i + 0.5), Y = (v) => M.t + ih - ih * v / maxV;
    PEOPLE.forEach((p) => {
      g += `<path d="${D.map((r, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(r[p.key]).toFixed(1)}`).join("")}" fill="none" stroke="${p.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      const last = D.length - 1;
      g += `<circle cx="${X(last)}" cy="${Y(D[last][p.key])}" r="4" fill="${p.color}" stroke="var(--surface)" stroke-width="2"/>`;
    });
    g += `<line class="xh" x1="0" x2="0" y1="${M.t}" y2="${M.t + ih}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
    g += PEOPLE.map((p, j) => `<circle class="dotp" data-j="${j}" r="5" fill="${p.color}" stroke="var(--surface)" stroke-width="2" opacity="0"/>`).join("");
    g += `<rect class="hitall" x="${M.l}" y="${M.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
    host.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitors and active users per day">${g}</svg>`;
    const svg = host.firstChild, t = tipFor(host), xh = svg.querySelector(".xh");
    svg.addEventListener("pointermove", (e) => {
      const b = svg.getBoundingClientRect(), fx = (e.clientX - b.left) / b.width * W;
      const i = Math.max(0, Math.min(D.length - 1, Math.floor((fx - M.l) / step))), r = D[i];
      xh.setAttribute("x1", X(i)); xh.setAttribute("x2", X(i)); xh.setAttribute("opacity", 1);
      svg.querySelectorAll(".dotp").forEach((c) => { const p = PEOPLE[+c.dataset.j]; c.setAttribute("cx", X(i)); c.setAttribute("cy", Y(r[p.key])); c.setAttribute("opacity", 1); });
      placeTip(t, svg, X(i) / W, `<b>${dayLabel(r.day)}</b>` + PEOPLE.map((p) =>
        `<div class="row"><span><i style="background:${p.color}"></i>${p.name}</span><span>${fmt(r[p.key])}</span></div>`).join("") +
        `<div class="row"><span>New accounts</span><span>${fmt(r.new_users)}</span></div>`);
    });
    svg.addEventListener("pointerleave", () => { t.classList.remove("on"); xh.setAttribute("opacity", 0); svg.querySelectorAll(".dotp").forEach((c) => c.setAttribute("opacity", 0)); });
  }
  function table(D) {
    const rows = [...D].reverse().map((r) => `<tr><td>${r.day}</td><td>${fmt(r.requests)}</td><td>${fmt(r.by_channel.anonymous)}</td><td>${fmt(r.by_channel.user_key)}</td>` +
      `<td>${fmt(r.by_channel.operator_key)}</td><td>${fmt(r.failed)}</td><td>${fmt(r.outputs)}</td><td>${fmt(r.anonymous_visitors)}</td><td>${fmt(r.active_users)}</td><td>${fmt(r.new_users)}</td></tr>`).join("");
    $("table").innerHTML = `<table><thead><tr><th>Day (UTC)</th><th>Requests</th><th>Playground</th><th>User keys</th><th>Operator</th><th>Failed</th><th>Answers</th><th>Visitors</th><th>Active users</th><th>New accounts</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  // a saved password from this browser tab signs straight in
  if (token) fetchStats(token, days).then((d) => { data = d; show(); }).catch(() => store.del());
})();
</script>
</body>
</html>
