# Layla API behind nginx. Replace layla.example.com with the real subdomain (not chosen yet).
# TLS: certbot (Let's Encrypt) on this host; certificate paths below are certbot's defaults.

limit_req_zone $binary_remote_addr zone=layla_anon:10m rate=60r/m;

upstream layla_api {
    server 127.0.0.1:8790;   # compose publishes the container on localhost only
    keepalive 16;
}

server {
    listen 80;
    server_name layla.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name layla.example.com;

    ssl_certificate     /etc/letsencrypt/live/layla.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/layla.example.com/privkey.pem;

    client_max_body_size 256k;          # text requests only

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location /api/ {
        limit_req zone=layla_anon burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://layla_api;
        proxy_read_timeout 40s;
    }

    # Streaming results: never buffer, or the page would wait for the whole answer.
    location = /api/v1/decisions/stream {
        limit_req zone=layla_anon burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://layla_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 40s;
    }

    location = /health { proxy_pass http://layla_api; access_log off; }
    location = /ready  { proxy_pass http://layla_api; access_log off; }

    # Web page, Swagger (/docs) and /openapi.json
    location / { proxy_pass http://layla_api; }
}
